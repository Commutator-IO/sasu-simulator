<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Filet de sécurité pour l'hébergement statique : après un redéploiement,
      // une page encore en cache peut référencer un asset dont le nom a changé,
      // d'où une page blanche. On détecte l'échec de chargement et on recharge
      // une fois — un rechargement revalide le HTML et récupère les bons noms.
      (function () {
        try {
          addEventListener(
            'error',
            function (e) {
              var el = e.target;
              var url = el && (el.src || el.href);
              if (url && /\/assets\//.test(url) && !sessionStorage.getItem('rechargeAsset')) {
                sessionStorage.setItem('rechargeAsset', '1');
                location.reload();
              }
            },
            true,
          );
          addEventListener('load', function () {
            sessionStorage.removeItem('rechargeAsset');
          });
        } catch (_) {}
      })();
    </script>
    <meta
      name="description"
      content="Le fil daté des textes fiscaux, des jalons de marché et des échéances derrière chaque paramètre du simulateur SASU : loi de finances, LFSS, barèmes Urssaf et Agirc-Arrco, AI Act, facturation électronique."
    />
    <title>Actualités — ce qui fait bouger les chiffres d’une SASU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mainActualites.tsx"></script>
  </body>
</html>
